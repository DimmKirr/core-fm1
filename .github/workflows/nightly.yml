name: Nightly builds

on:
  push:
    branches: [nightly]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pages: write

concurrency:
  group: melodee-nightly-pages
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      JIELI_TOOLCHAIN: ${{ github.workspace }}/.nightly-deps/jieli/toolchain
      AC79_SDK: ${{ github.workspace }}/.nightly-deps/sdk
      PARALLEL: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nightly
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libharfbuzz-dev libfribidi-dev libraqm-dev
          python -m pip install Pillow fonttools mido
      - uses: actions/cache@v4
        with:
          path: .nightly-deps
          key: jieli-linux-sdk-d179b448-v1
      - name: Fetch pinned SDK and toolchain
        run: |
          if [ ! -x "$JIELI_TOOLCHAIN/pi32v2/bin/clang" ]; then
            tools/get_toolchain.sh "$GITHUB_WORKSPACE/.nightly-deps/jieli"
          fi
          if [ ! -d "$AC79_SDK/.git" ]; then
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$AC79_SDK"
          fi
          test "$(git -C "$AC79_SDK" rev-parse HEAD)" = d179b4484759423312073f5fbb232501aa491047
      - name: Build dual core and run host/web checks
        env:
          MELODEE_DUAL_CORE: '1'
          MELODEE_CORE1_FALLBACK: '0'
          MELODEE_RAM_AUDIO: '1'
          MELODEE_CACHE_RAM: '1'
          MELODEE_ADMISSION: '0'
          MELODEE_AUDIO_PROFILE: '0'
          MELODEE_AUDIO_BENCH: '0'
          MELODEE_MOD_CACHE: '1'
          MELODEE_CONTROL_FAST: '1'
          MELODEE_MIX_FAST: '1'
          MELODEE_FX_DORMANT: '1'
          MELODEE_RECORD_INDEX: '1'
          MELODEE_PROPHET_FAST: '1'
          MELODEE_PANEL_FAST: '1'
          MELODEE_FM6_FAST: '1'
          MELODEE_CZ_FAST: '1'
          MELODEE_DRUM_FAST: '1'
          MELODEE_SID_FAST: '1'
          MELODEE_CAPTURE_FAST: '1'
        run: |
          ./build.sh --nightly
          cp build/melodee-nightly.fwsc build/melodee.fwsc
          # Host compilation must exercise the same twelve candidates.
          CC="${CC:-cc}"
          for flag in MELODEE_MOD_CACHE MELODEE_CONTROL_FAST MELODEE_MIX_FAST \
            MELODEE_FX_DORMANT MELODEE_RECORD_INDEX MELODEE_PROPHET_FAST \
            MELODEE_PANEL_FAST MELODEE_FM6_FAST MELODEE_CZ_FAST \
            MELODEE_DRUM_FAST MELODEE_SID_FAST MELODEE_CAPTURE_FAST; do
            CC="$CC -D$flag=${!flag}"
          done
          export CC
          tests/run_tests.sh
      - name: Save build provenance and checksums
        run: |
          git rev-parse HEAD > build/nightly-commit.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > build/nightly-built-at.txt
          cd build
          sha256sum melodee-nightly.fwsc > SHA256SUMS-nightly
      - uses: actions/upload-artifact@v4
        with:
          name: melodee-nightly-${{ github.run_number }}
          path: |
            build/melodee-nightly.fwsc
            build/nightly-*.txt
            build/SHA256SUMS-nightly
            LICENSE
            LICENSING.md
            LICENSES
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .nightly-pages
          fetch-depth: 0
      - name: Publish installer and nightly packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python web/import_releases.py .nightly-pages --repo "$GITHUB_REPOSITORY"
          # Keep the stable guide; publish development documentation at its own path.
          python tools/manual_shots.py
          python tools/manual_shots.py --require
          commit=$(cat build/nightly-commit.txt)
          python web/publish_nightly.py .nightly-pages \
            --dual build/melodee-nightly.fwsc \
            --version "next-${commit:0:7}" --commit "$commit" --built-at "$(cat build/nightly-built-at.txt)" \
            --manual web/manual
          cp build/SHA256SUMS-nightly .nightly-pages/firmware/SHA256SUMS-nightly
          cd .nightly-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add webapp firmware
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish nightly firmware'
            git push origin HEAD:gh-pages
          fi
      - name: Request and verify Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          expected=$(git -C .nightly-pages rev-parse HEAD)
          published=false
          for attempt in $(seq 1 60); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest")
            status=$(echo "$result" | jq -r .status)
            revision=$(echo "$result" | jq -r .commit)
            if [ "$revision" = "$expected" ] && [ "$status" = built ]; then
              published=true
              break
            fi
            if [ "$revision" = "$expected" ] && [ "$status" = errored ]; then
              echo "$result"
              exit 1
            fi
            sleep 10
          done
          test "$published" = true
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          python web/verify_nightly.py "$site" build
