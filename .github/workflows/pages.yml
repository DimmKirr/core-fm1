# SPDX-License-Identifier: GPL-3.0-only
# The static web site on GitHub Pages: the web installer and the web editor, made by web/make_site.py (no server).
# make_site.py bundles the firmware packages listed in web/flavours.json into the site (firmware/optimist-<version>-<id>.fwsc,
# which the installer page fetches by a relative URL and checks against the SHA-256 written into the page); this builds
# the profile of each entry, with the toolchain downloaded on the runner as build.yml does. Add a flavour by adding an
# entry to the manifest. The editor needs no firmware. Details: docs/PAGES.md.
#
# Needs Pages enabled with the source "GitHub Actions" (Settings > Pages); on a private repository that needs a
# plan that allows Pages for private repositories. Written for the repository once it is public; not run yet.
# Pages serves the site under /<repository>/ : every URL in the site is relative, so that works.
name: pages

on:
  push:
    branches: [main, optimist]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Cache the toolchain and the SDK files
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.jieli
            sdk
          key: jieli-${{ hashFiles('tools/toolchain.py') }}
      - name: Setup (toolchain, SDK files, Python packages)
        run: python tools/optimist.py setup --yes --no-emu
      - name: Package the profile of each flavour in web/flavours.json
        run: |
          for profile in $(python3 web/make_site.py --profiles); do
            python tools/optimist.py package --profile "$profile" --out dist
          done
      - name: Make the site
        env:
          OPTIMIST_SOURCE_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}   # the page's Source link: the tag
        run: |
          python3 web/make_site.py --flavours web/flavours.json "$(tr -d '[:space:]' < VERSION)" site
          touch site/.nojekyll
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
