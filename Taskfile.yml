version: '3'

includes:
  fm1-platform:
    taskfile: https://raw.githubusercontent.com/DimmKirr/setup-fm1-toolchain/v1/Taskfile.yml
  fm1-emulator:
    taskfile: /Users/dmitry/dev/dimmkirr/setup-fm1-emulator/Taskfile.yml
    vars:
      FM1_VERSION: v0.3.0
      FM1_SOURCE_REPO: DimmKirr/fm1-emu
  debug:wifi:
    taskfile: docs/hardware/wifi/Taskfile.yml
    dir: '{{.ROOT_DIR}}'

tasks:
  build:
    desc: Generate config.h and compile firmware
    deps: [fm1-platform:download:sdk, fm1-platform:download:toolchain]
    env:
      JIELI_TOOLCHAIN: '{{env "JIELI_TOOLCHAIN" | default (printf "%s/.fm1-toolchain/toolchain" .HOME)}}'
      AC79_SDK: '{{env "AC79_SDK" | default (printf "%s/.fm1-toolchain/AC79_SDK" .HOME)}}'
    sources:
      - firmware/**/*
      - tools/build.py
      - tools/genconfig.py
      - tools/logo_convert.py
      - tools/gen_engine_tables.py
      - kconf/**/*
      - configs/**/*
      - assets/**/*
      - Kconfig
      - .config
    generates:
      - build/core-fm1.fwsc
    method: checksum
    cmds:
      - uv run --quiet python tools/build.py {{.CLI_ARGS}}

  build:dry-run:
    desc: Show what would be compiled without building
    cmds:
      - uv run --quiet python tools/build.py --dry-run

  test:
    desc: Run all tests (unit + e2e)
    cmds:
      - task: test:unit
      - task: test:e2e

  test:unit:
    desc: Run Python unit tests (genconfig, defconfigs, tooling)
    cmds:
      - uv run --quiet python -m pytest tests/ -v --ignore-glob="tests/e2e_*"

  test:e2e:
    desc: Run E2E tests via fm1-emu emulator + Playwright
    deps:
      - task: build
        vars:
          CLI_ARGS: ''
      - fm1-emulator:download:wasm
    env:
      FM1_WEB_DIR: '{{env "FM1_WEB_DIR" | default (printf "%s/.fm1-emulator/web" .HOME)}}'
      PLAYWRIGHT_BROWSERS_PATH: '{{env "PLAYWRIGHT_BROWSERS_PATH" | default (printf "%s/.cache/ms-playwright" .HOME)}}'
    cmds:
      - uv run --quiet python -m pytest tests/e2e_boot_test.py tests/e2e_components_test.py tests/e2e_usb_safety_test.py tests/e2e_audio_test.py tests/e2e_audio_engines_test.py tests/e2e_ble_test.py tests/e2e_weather_test.py -v {{.CLI_ARGS}}

  emulator:build:
    desc: Build WASM from a local fm1-emu checkout (requires the Rust WASM target)
    requires:
      vars: [EMU_SOURCE]
    preconditions:
      - test -f '{{.EMU_SOURCE}}/web/build.sh'
    cmds:
      - bash '{{.EMU_SOURCE}}/web/build.sh' '{{.HOME}}/.fm1-emulator/web'

  flash:
    desc: Flash firmware to FM-1 over USB-MIDI (DEBUG=true for post-flash log follow)
    silent: true
    vars:
      FIRMWARE: '{{.FIRMWARE | default "build/core-fm1.fwsc"}}'
      DEBUG: '{{.DEBUG | default "true"}}'
      AUTO_APPROVE: '{{.AUTO_APPROVE | default "true"}}'
    preconditions:
      - sh: test -f {{.FIRMWARE}}
        msg: "{{.FIRMWARE}} not found. Run 'task build' first."
    cmds:
      - cmd: |
          test -f build/core-fm1.version && echo "version: $(cat build/core-fm1.version)" || true
      - uv run --quiet --group flash python tools/fm1_install.py {{.FIRMWARE}} --force {{if eq .AUTO_APPROVE "true"}}--yes {{end}}{{.CLI_ARGS}}
      - cmd: |
          if [ "{{.DEBUG}}" = "true" ]; then
            mkdir -p .scratch/debug
            LOG=".scratch/debug/boot.log"
            {
              echo ""
              echo "=== POST-FLASH DEBUG ==="
              sleep 2
              for i in 1 2 3 4 5; do
                echo "--- attempt $i ---"
                uv run --quiet --with python-rtmidi python tools/fm1log.py --hello 2>&1 && break
                sleep 2
              done
              echo ""
              echo "=== LOG (follow, Ctrl-C to stop) ==="
              uv run --quiet --with python-rtmidi python tools/fm1log.py --follow 2>&1 || true
              echo ""
              echo "=== POST-CRASH RECOVERY ==="
              echo "Waiting for device to reboot..."
              sleep 5
              for i in 1 2 3 4 5; do
                echo "--- crash-log attempt $i ---"
                uv run --quiet --with python-rtmidi python tools/fm1log.py --hello 2>&1 && break
                sleep 2
              done
              echo ""
              echo "=== CRASH LOG ==="
              uv run --quiet --with python-rtmidi python tools/fm1log.py 2>&1 || true
            } 2>&1 | tee "$LOG"
          fi

  flash:uboot:
    desc: Flash firmware via UBOOT mode (hold OCT+/- for 5s, then run this)
    silent: true
    vars:
      FIRMWARE: '{{.FIRMWARE | default "build/core-fm1.fwsc"}}'
    preconditions:
      - sh: test -f {{.FIRMWARE}}
        msg: "{{.FIRMWARE}} not found. Run 'task build' first."
    cmds:
      - cmd: |
          test -f build/core-fm1.version && echo "version: $(cat build/core-fm1.version)" || true
      - uv sync --quiet --group uboot
      - sudo uv run --quiet --group uboot python tools/fm1_uboot_flash.py {{.FIRMWARE}} {{.CLI_ARGS}}

  flash:debug:
    desc: Debug flash issues - list MIDI devices and retry update loader detection
    cmds:
      - cmd: |
          echo "=== MIDI devices ==="
          uv run --quiet --group flash python -c "
          import rtmidi
          mi = rtmidi.MidiIn()
          mo = rtmidi.MidiOut()
          print('IN: ', mi.get_ports())
          print('OUT:', mo.get_ports())
          "
          echo ""
          echo "=== Looking for FM-1 or Update Loader (10s) ==="
          uv run --quiet --group flash python -c "
          import rtmidi, time
          for i in range(20):
              mi = rtmidi.MidiIn()
              ports = mi.get_ports()
              for p in ports:
                  if 'FM-1' in p or 'Felucca' in p or 'Update' in p:
                      print(f'  found: {p}')
              if not any('FM-1' in p or 'Felucca' in p or 'Update' in p for p in ports):
                  print(f'  [{i*0.5:.1f}s] no FM-1 device')
              time.sleep(0.5)
          "
          echo ""
          echo "If 'Felucca Update' appeared, run: task flash"
          echo "If only 'FM-1' appeared, the device is in normal mode."
          echo "If nothing appeared, check USB cable."

  recovery:download-stock-firmware:
    desc: Download official M-VAVE FM-1 stock firmware V15 (.fwsc)
    vars:
      STOCK_FWSC: '{{.ROOT_DIR}}/build/mvave-fm1-original-v15.fwsc'
    status:
      - test -f '{{.STOCK_FWSC}}'
    cmds:
      - mkdir -p build
      - curl -fL -o '{{.STOCK_FWSC}}' https://github.com/m-vave/fm1_open/raw/main/sdk/firmware/FM-1_015.fwsc
      - echo "Downloaded stock V15 firmware to {{.STOCK_FWSC}}"

  recovery:transporter:rpi:flash:
    desc: Flash Transporter firmware onto a Raspberry Pi Pico (hold BOOTSEL, plug in, then run this)
    vars:
      RECOVERY_DIR: '{{.ROOT_DIR}}/.scratch/examples/Transporter/pico-fork/recovery'
    dir: '{{.RECOVERY_DIR}}'
    preconditions:
      - sh: test -f '{{.RECOVERY_DIR}}/fm1_transporter_recover.py'
        msg: "Recovery script not found. Run: git clone --depth 1 https://github.com/Nicodesy06/FM1Trasmitter-for-pico .scratch/examples/Transporter/pico-fork"
    cmds:
      - uv run --quiet --group unbrick python fm1_transporter_recover.py setup --board pico_rp2040
      - uv run --quiet --group unbrick python fm1_transporter_recover.py flash-board --board pico_rp2040 {{.CLI_ARGS}}

  recovery:transporter:fm1:unbrick:
    desc: Recover a hard-bricked FM-1 via Transporter (Pico wired to FM-1, no USB presence)
    deps: [recovery:download-stock-firmware]
    vars:
      RECOVERY_DIR: '{{.ROOT_DIR}}/.scratch/examples/Transporter/pico-fork/recovery'
      STOCK_FWSC: '{{.ROOT_DIR}}/build/mvave-fm1-original-v15.fwsc'
    dir: '{{.RECOVERY_DIR}}'
    preconditions:
      - sh: test -f '{{.RECOVERY_DIR}}/fm1_transporter_recover.py'
        msg: "Recovery script not found. Run: git clone --depth 1 https://github.com/Nicodesy06/FM1Trasmitter-for-pico .scratch/examples/Transporter/pico-fork"
    cmds:
      - uv run --quiet --group unbrick python fm1_transporter_recover.py recover --board pico_rp2040 --v15 '{{.STOCK_FWSC}}' '{{.STOCK_FWSC}}' {{.CLI_ARGS}}

  recovery:transporter:fm1:unbrick-soft:
    desc: Restore firmware via USB ROM boot mode (soft-bricked device)
    deps: [recovery:download-stock-firmware]
    vars:
      UNBRICKER_DIR: '{{env "UNBRICKER_DIR" | default (printf "%s/.fm1-toolchain/unbricker" .HOME)}}'
      STOCK_FWSC: '{{.ROOT_DIR}}/build/mvave-fm1-original-v15.fwsc'
    cmds:
      - |
        if [ ! -d "{{.UNBRICKER_DIR}}" ]; then
          echo "Cloning MvaveFM1Unbricker..."
          git clone --depth 1 https://github.com/Quixotic7/MvaveFM1Unbricker "{{.UNBRICKER_DIR}}"
        fi
      - uv run --quiet --group unbrick python "{{.UNBRICKER_DIR}}/fm1_unbrick.py" restore '{{.STOCK_FWSC}}' {{.CLI_ARGS}}

  logs:
    desc: Tail debug log from FM-1 over USB MIDI SysEx (DAP protocol)
    silent: true
    cmds:
      - uv run --quiet --with python-rtmidi python tools/fm1log.py --follow {{.CLI_ARGS}}

  logs:dump:
    desc: Dump current debug log buffer and exit
    silent: true
    cmds:
      - uv run --quiet --with python-rtmidi python tools/fm1log.py {{.CLI_ARGS}}

  logs:hello:
    desc: Print FM-1 device status (crash record, render stats, log position)
    silent: true
    cmds:
      - uv run --quiet --with python-rtmidi python tools/fm1log.py --hello {{.CLI_ARGS}}

  debug:dump:
    desc: Dump debug log buffer and save to .scratch/debug/dump.log
    silent: true
    cmds:
      - mkdir -p .scratch/debug
      - |
        echo "=== debug:dump $(date -Iseconds) ===" | tee .scratch/debug/dump.log
        echo "=== config.h symbols ===" | tee -a .scratch/debug/dump.log
        grep '^#define CONFIG_' build/gen/config.h 2>/dev/null | tee -a .scratch/debug/dump.log
        echo "" | tee -a .scratch/debug/dump.log
        echo "=== .bss/.pool sizes (from linker map) ===" | tee -a .scratch/debug/dump.log
        grep -E '^\.(bss|pool)\b|_bss_(start|end)|_pool_(start|end)' build/core_fm1.map 2>/dev/null | tee -a .scratch/debug/dump.log
        echo "" | tee -a .scratch/debug/dump.log
        echo "=== firmware size ===" | tee -a .scratch/debug/dump.log
        ls -la build/core-fm1.fwsc build/core_fm1.elf 2>/dev/null | tee -a .scratch/debug/dump.log
        echo "" | tee -a .scratch/debug/dump.log
        echo "=== DAP log buffer ===" | tee -a .scratch/debug/dump.log
        uv run --quiet --with python-rtmidi python tools/fm1log.py {{.CLI_ARGS}} 2>&1 | tee -a .scratch/debug/dump.log

  debug:hello:
    desc: Print device status and save to .scratch/debug/hello.log
    silent: true
    cmds:
      - mkdir -p .scratch/debug
      - |
        echo "=== debug:hello $(date -Iseconds) ===" | tee .scratch/debug/hello.log
        uv run --quiet --with python-rtmidi python tools/fm1log.py --hello {{.CLI_ARGS}} 2>&1 | tee -a .scratch/debug/hello.log

  debug:input:
    desc: "Test input: HOLD a button/key, then run this. Saves to .scratch/debug/input.log"
    silent: true
    cmds:
      - mkdir -p .scratch/debug
      - |
        echo "=== debug:input $(date -Iseconds) ===" | tee .scratch/debug/input.log
        echo "Hold a button or key on the FM-1 NOW, then press Enter..." | tee -a .scratch/debug/input.log
        read -r
        echo "Capturing log (hold button for 5 more seconds)..." | tee -a .scratch/debug/input.log
        uv run --quiet --with python-rtmidi python tools/fm1log.py 2>&1 | tee -a .scratch/debug/input.log
        echo "" | tee -a .scratch/debug/input.log
        echo "Look for raw0-3 != 0 or btns != 0 in the heartbeats above." | tee -a .scratch/debug/input.log
        echo "If all zeros while holding a button, input hardware is not working." | tee -a .scratch/debug/input.log

  settings:reset:
    desc: Reset FM-1 settings to defaults (erases saved settings, device reboots)
    silent: true
    cmds:
      - uv run --quiet --group flash python tools/fm1_settings_reset.py {{.CLI_ARGS}}

  docs:
    desc: Regenerate all generated documentation
    cmds:
      - task: docs:module-diagram

  docs:module-diagram:
    desc: Regenerate the module dependency diagram in docs/COMPONENTS.md
    sources:
      - kconf/*.kconfig
    cmds:
      - uv run --quiet kc2mm inject docs/COMPONENTS.md --kconf-dir kconf

  docs:check:
    desc: Verify generated docs match their sources (for CI)
    cmds:
      - uv run --quiet kc2mm inject --check docs/COMPONENTS.md --kconf-dir kconf

  config:
    desc: Run menuconfig (ncurses) to configure the build
    cmds:
      - uv run --quiet python tools/menuconfig.py

  config:defconfig:
    desc: Load a named defconfig (e.g. task config:defconfig -- melodee)
    cmds:
      - uv run --quiet python tools/genconfig.py --defconfig {{.CLI_ARGS}}

  config:generate:
    desc: Generate build/gen/config.h from current .config
    cmds:
      - uv run --quiet python tools/genconfig.py
