<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- FM Lab: a modulator feeding a carrier, and the wave that comes out of it.
       The wave is plotted, not drawn: sin(4t + 1.2 sin t), which is the whole idea.
       Original work, GPL-3.0-only like the rest of the firmware. -->
  <rect width="128" height="128" rx="26" fill="#2a1446"/>

  <!-- the modulator: an outline, because it is only felt -->
  <rect x="44" y="18" width="40" height="26" rx="6" fill="none" stroke="#b48cff" stroke-width="5"/>
  <path d="M52 31 q5 -7 10 0 t10 0" fill="none" stroke="#b48cff" stroke-width="3.5" stroke-linecap="round"/>

  <path d="M64 44 v13" fill="none" stroke="#b48cff" stroke-width="5" stroke-linecap="round"/>
  <path d="M58 51 l6 7 l6 -7" fill="none" stroke="#b48cff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the carrier: filled, because this is the one you hear -->
  <rect x="44" y="58" width="40" height="26" rx="6" fill="#b48cff"/>
  <path d="M52 71 q5 -7 10 0 t10 0" fill="none" stroke="#2a1446" stroke-width="3.5" stroke-linecap="round"/>

