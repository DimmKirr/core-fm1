[project]
name = "core-fm1"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fonttools>=4.65.0",
    "kconfiglib>=14.1.0",
    "pillow>=12.3.0",
    "skidl>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "playwright>=1.50",
]
flash = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]
uboot = [
    "pyusb>=1.2",
]
unbrick = [
    "crcmod>=1.7",
    "pyserial>=3.5",
    "pyyaml>=6.0",
    "pycryptodomex>=3.20",
    "tqdm>=4.66",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
